name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # El repo tiene deuda de lint preexistente (warnings de "any" y algunos
      # errores puntuales) — se reporta pero no bloquea el CI hasta limpiarla,
      # para que este workflow no arranque en rojo desde el primer push.
      - run: npm run lint
        continue-on-error: true

      - run: npm run build
