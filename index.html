<!doctype html>
<!-- lang="es": la interfaz está en español. Antes decía "en", lo que hacía que
     Chrome ofreciera "traducir" y convirtiera términos técnicos como "S/D"
     (Sin Dato) en "Dakota del Sur", "balance"→"saldo", etc. translate="no"
     desactiva la traducción automática del navegador para toda la app. -->
<html lang="es" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/png" href="/logos/logo-srl.png" />
  <!-- viewport-fit=cover: la app pinta bajo la isla dinámica/barra de gestos del iPhone y respeta las
       zonas seguras con env(safe-area-inset-*) (variables --sat/--sab/--sal/--sar en index.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SICA 005" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Conchos Digital v%APP_VERSION%</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
